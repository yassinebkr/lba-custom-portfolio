name: Asset pipeline batch and visual QA

on:
  push:
    branches:
      - feature/portfolio-studio-j1-j8
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-image-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Test the legacy single-asset and new batch pipelines
        run: python -m unittest discover -s pipeline/tests -v
      - name: Generate original QA fixtures and atlases
        run: |
          python pipeline/fixtures/generate_samples.py --out /tmp/atlas-fixtures
          python pipeline/asset_batch.py /tmp/atlas-fixtures/recipe.json --out /tmp/atlas-previews
      - name: Publish actual generated contact sheets (NOT final artwork)
        uses: actions/upload-artifact@v4
        with:
          name: j3-asset-qa-contact-sheets
          path: /tmp/atlas-previews/
