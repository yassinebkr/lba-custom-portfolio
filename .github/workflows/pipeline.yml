name: Original asset pipeline checks

on:
  push:
    branches:
      - feature/portfolio-studio-j1-j8
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-image-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Run deterministic image handling tests
        run: python -m unittest discover -s pipeline/tests -v
