name: DOS runtime compatibility milestones

on:
  push:
    branches: [feature/portfolio-studio-j1-j8]
    paths:
      - 'scripts/runtime/**'
      - 'packages/world-package/**'
      - 'adapters/lba-dos/**'
      - 'examples/world-package/**'
      - 'tests/runtime-*.test.mjs'
      - 'scripts/hqr-tools/patch-relent.js'
      - 'scripts/build-web-bundle.sh'
      - '.github/workflows/dos-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux ISO9660 writer
        run: sudo apt-get update -qq && sudo apt-get install -y xorriso
      - name: Verify private DOS Linux packaging with synthetic inputs
        run: python3 -m unittest discover -s scripts/runtime -p 'test_private_jsdos.py' -v
      - name: Audit legacy resource boundaries
        run: |
          node scripts/runtime/audit.mjs > /tmp/r01-audit.json
          node --test tests/runtime-audit.test.mjs
      - name: Validate original world package and files
        run: |
          node --test tests/runtime-world.test.mjs tests/runtime-files.test.mjs
          node scripts/runtime/validate-world.mjs examples/world-package/telemetry.json --root . > /tmp/r02-world.json
      - name: Install private DOS compatibility codec dependencies
        working-directory: adapters/lba-dos
        run: npm install --no-audit --no-fund
      - name: Test original image to indexed DOS codec and private archive index safeguards
        run: node --test adapters/lba-dos/index.test.mjs adapters/lba-dos/overlay.test.mjs adapters/lba-dos/cli.test.mjs adapters/lba-dos/cli-safety.test.mjs
      - name: Produce real R03 indexed compatibility previews
        run: |
          node adapters/lba-dos/cli.mjs examples/world-package/telemetry.json --root . --target 128 --out output/r03-dos-compat
          test -f output/r03-dos-compat/report.json
      - name: Archive original compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: r03-original-dos-codec-evidence
          path: output/r03-dos-compat/
          if-no-files-found: error
