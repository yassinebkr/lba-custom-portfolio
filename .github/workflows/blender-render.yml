name: M3 Blender original-model 3D smoke

on:
  push:
    branches: [feature/portfolio-studio-j1-j8]
    paths:
      - 'pipeline/blender/**'
      - '.github/workflows/blender-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-original-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil libegl1 libgl1-mesa-dri
          python -m pip install Pillow==11.3.0
      - name: Produce original asymmetrical test GLB
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python pipeline/blender/tests/build_original_fixture.py -- /tmp/atlas-original-fixture.glb
          test -s /tmp/atlas-original-fixture.glb
      - name: Render four transparent directional frames
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python pipeline/blender/render_iso.py -- --input /tmp/atlas-original-fixture.glb --output /tmp/atlas-blender-spike --size 768
      - name: Check exact image geometry, transparency and distinct views
        run: python pipeline/blender/tests/check_rendered_fixture.py /tmp/atlas-blender-spike
      - name: Convert real Blender PNG views with the project sprite pipeline
        run: |
          python pipeline/original_recipe.py /tmp/atlas-blender-spike/animation.json --id telemetry-receiver --kind prop --creator 'Project Atlas original fixture' --width 256 --height 256 --colors 160
          python pipeline/asset_batch.py /tmp/atlas-blender-spike/recipe.json --out /tmp/atlas-blender-spike/packed
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          out=Path('/tmp/atlas-blender-spike/packed')
          m=json.loads((out/'assets.json').read_text())
          assert len(m['assets'])==1
          a=m['assets'][0]
          assert len(a['frames'])==4
          assert {f['direction'] for f in a['frames']} == {'NE','NW','SE','SW'}
          assert not a['source']['allowedForPublicBuild']
          with Image.open(out/a['atlasRef']) as png:
              assert png.size==(1024,256),png.size
              assert png.mode=='RGBA'
          print('Verified four-frame original sprite atlas, pending artistic review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-blender-original-fixture-render
          path: /tmp/atlas-blender-spike/
          if-no-files-found: ignore
