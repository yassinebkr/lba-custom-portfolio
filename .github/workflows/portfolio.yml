name: Portfolio J1 checks and optional Pages deployment

on:
  push:
    branches:
      - feature/portfolio-studio-j1-j8
    paths:
      - 'apps/portfolio/**'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test navigation, collisions and scene validation
        run: node --test apps/portfolio/rules.test.mjs
      - name: Reject proprietary game archives and executables in Pages source
        run: |
          if find apps/portfolio -type f \( -iname '*.hqr' -o -iname '*.exe' -o -iname '*.jsdos' -o -iname '*.iso' -o -iname '*.vox' -o -iname '*.fla' \) | grep . ; then
            echo "Forbidden game asset in public app"
            exit 1
          fi
          test -f apps/portfolio/index.html
          test -f apps/portfolio/game.mjs
          test -f apps/portfolio/rules.mjs
      - name: Create isolated static artifact
        run: |
          mkdir -p /tmp/portfolio-public
          cp apps/portfolio/index.html apps/portfolio/game.mjs apps/portfolio/rules.mjs /tmp/portfolio-public/
      - uses: actions/upload-artifact@v4
        with:
          name: static-portfolio-j1
          path: /tmp/portfolio-public

  publish-pages:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public-only files
        run: |
          mkdir -p dist
          cp apps/portfolio/index.html apps/portfolio/game.mjs apps/portfolio/rules.mjs dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
