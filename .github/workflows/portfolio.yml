name: Portfolio CI and optional Pages deployment

on:
  push:
    branches:
      - feature/portfolio-studio-j1-j8
    paths:
      - 'apps/portfolio/**'
      - 'packages/asset-core/**'
      - 'packages/scene-core/**'
      - 'packages/public-manifest/**'
      - 'scripts/build-portfolio.mjs'
      - 'tests/public-build.test.mjs'
      - 'tests/pages-root.test.mjs'
      - 'index.html'
      - 'docs/PAGES_DEPLOYMENT.md'
      - '.github/workflows/portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure game rule tests
        run: node --test apps/portfolio/rules.test.mjs apps/portfolio/rooms.test.mjs packages/scene-core/scene.test.mjs packages/asset-core/index.test.mjs packages/public-manifest/index.test.mjs
      - name: Prevent proprietary game files in public bundle
        run: |
          if find apps/portfolio -type f \( -iname '*.hqr' -o -iname '*.exe' -o -iname '*.jsdos' -o -iname '*.iso' -o -iname '*.vox' -o -iname '*.fla' \) | grep . ; then
            echo "Forbidden original LBA files in public artifact"
            exit 1
          fi
          test -f apps/portfolio/index.html
          test -f apps/portfolio/game.mjs
          test -f apps/portfolio/rules.mjs
          test -f apps/portfolio/rooms.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the actual public artifact
        run: node scripts/build-portfolio.mjs
      - name: Browser smoke from the deployed artifact at the Pages subpath
        run: node apps/portfolio/test-e2e.mjs
      - name: Capture browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-e2e-screenshots
          path: |
            portfolio-desktop.png
            portfolio-mobile.png
          if-no-files-found: ignore
      - name: Audit public-only Pages artifact and root fallback
        run: |
          node --test tests/public-build.test.mjs tests/pages-root.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-public-static
          path: dist

  publish-pages:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build publishable files from the same allowlist as CI
        run: node scripts/build-portfolio.mjs
      - name: Verify complete published artifact
        run: node --test tests/public-build.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
